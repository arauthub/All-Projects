version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/arnas/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/arnas/mobile"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/flashapps/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/agents/myagents"
    schedule:
      interval: "weekly"
