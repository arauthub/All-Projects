name: Deploy Nexus Prime Jamstack to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Jamstack Static Assets
        run: |
          cd apps/jamstack-frontend
          npm test
          npm run build

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/jamstack-frontend
          branch: gh-pages

      - name: Upload Pages Artifact (for GitHub Actions Mode)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: 'apps/jamstack-frontend'

      - name: Deploy to GitHub Pages (for GitHub Actions Mode)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
