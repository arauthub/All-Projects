name: Deploy Nexus Prime Jamstack to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/jamstack-frontend/**'
      - '.github/workflows/deploy-jamstack.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Jamstack Static Assets
        run: |
          cd apps/jamstack-frontend
          npm test
          npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/jamstack-frontend
          branch: gh-pages
