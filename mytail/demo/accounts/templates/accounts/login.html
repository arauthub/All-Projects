{% extends "base.html" %}
{% load static %}
{% block content %}
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-lg rounded-4 p-4">
          <h4 class="text-center mb-4 fw-bold" style="font-size: 2rem;">Login</h4>
          <form method="post" autocomplete="off">
            {% csrf_token %}
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input id="username" name="username" type="text" class="form-control" value="{{ form.username.value|default_if_none:'' }}" required>
              {% if form.username.errors %}
                <div class="form-text text-danger">{{ form.username.errors|striptags }}</div>
              {% endif %}
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input id="password" name="password" type="password" class="form-control" required>
              {% if form.password.errors %}
                <div class="form-text text-danger">{{ form.password.errors|striptags }}</div>
              {% endif %}
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
          </form>
          <div class="text-center mt-3">
            <a href="{% url 'signup' %}" class="link-primary">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
