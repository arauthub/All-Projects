{% extends "base.html" %}
{% load static %}
{% block content %}
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-lg rounded-4 p-4">
          <h4 class="text-center mb-4 fw-bold" style="font-size: 2.2rem;">Reset Password</h4>
          <form method="post" autocomplete="off">
            {% csrf_token %}
            <div class="mb-4">
              <label for="new_password" class="form-label">New Password</label>
              <input id="new_password" name="new_password" type="password" class="form-control" required>
            </div>
            <div class="mb-4">
              <label for="confirm_password" class="form-label">Confirm Password</label>
              <input id="confirm_password" name="confirm_password" type="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Reset Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
