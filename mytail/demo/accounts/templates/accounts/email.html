{% extends "base.html" %}
{% load static %}
{% block content %}
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-lg rounded-4 p-4">
          <h4 class="text-center mb-4 fw-bold" style="font-size: 2.2rem;">Email Address</h4>
          <form method="post" autocomplete="off">
            {% csrf_token %}
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input id="email" name="email" type="email" class="form-control" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-send"></i>
              <span class="fw-semibold">Submit</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
