{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-3">Create Blog Post</h4>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_title" class="form-label">Title</label>
              <input id="id_title" name="title" type="text" class="form-control" value="{{ form.title.value|default_if_none:'' }}" required>
            </div>
            <div class="mb-3">
              <label for="id_content" class="form-label">Content</label>
              <textarea id="id_content" name="content" class="form-control" rows="6" required>{{ form.content.value|default_if_none:'' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Post</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
