apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: arnas-server
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/cloudsql-instances: "${SQL_CONNECTION_NAME}"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: ${IMAGE_URI}
        resources:
          limits:
            cpu: 2000m
            memory: 2048Mi
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
        - name: HOST
          value: "0.0.0.0"
        - name: STORAGE_ROOT
          value: "/data/storage"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
