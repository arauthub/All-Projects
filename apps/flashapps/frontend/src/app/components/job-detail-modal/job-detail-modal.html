<div class="job-modal-container">
    <h2 mat-dialog-title>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <mat-icon style="color: var(--primary); font-size: 28px; width: 28px; height: 28px;">build_circle</mat-icon>
                <div style="display: flex; flex-direction: column;">
                    <span style="font-weight: 700;">Job Workspace: {{jobDisplay}}</span>
                    <span style="font-size: 0.85rem; color: #666; font-weight: 400;">{{vehicleName}}</span>
                </div>
            </div>
            <button mat-icon-button (click)="close()"><mat-icon>close</mat-icon></button>
        </div>
    </h2>
    
    <mat-dialog-content class="mat-typography" style="padding-top: 16px;">
        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <div class="meta-card">
                <mat-form-field appearance="outline" style="width: 100%;">
                    <mat-label>Current Status</mat-label>
                    <mat-select [(ngModel)]="currentStatus">
                        <mat-option *ngFor="let opt of statusOptions" [value]="opt.value">
                            {{opt.label}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="meta-card">
                <h4 style="margin-top: 0; color: #2c3e50; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    <mat-icon style="font-size: 20px; width: 20px; height: 20px;">engineering</mat-icon> Next Steps & Technical Notes
                </h4>
                <mat-form-field appearance="outline" style="width: 100%;">
                    <mat-label>Future References / Technician Instructions</mat-label>
                    <textarea matInput [(ngModel)]="technicianNotes" rows="6" placeholder="Document any anomalies, pending parts, or instructions for the next mechanic here..."></textarea>
                </mat-form-field>
            </div>

        </div>
    </mat-dialog-content>
    
    <mat-dialog-actions align="end" style="padding: 16px 24px;">
        <button mat-button (click)="close()" style="margin-right: 8px;">Cancel</button>
        <button mat-flat-button color="primary" (click)="saveChanges()" [disabled]="isSaving">
            <mat-icon *ngIf="isSaving" style="animation: spin 1s linear infinite;">autorenew</mat-icon>
            <mat-icon *ngIf="!isSaving">save</mat-icon>
            Commit Details
        </button>
    </mat-dialog-actions>
</div>
