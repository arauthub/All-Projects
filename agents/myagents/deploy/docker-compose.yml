version: '3.8'

services:
  myagents-orchestrator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: myagents-orchestrator
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
